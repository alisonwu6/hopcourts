openapi: 3.0.0
info:
  title: SportsMatch Storage API
  version: 1.0.0
tags:
  - name: Storage
    description: Supabase Storage helpers for avatar uploads.
paths:
  /api/storage/avatar-upload-url:
    get:
      tags: [Storage]
      summary: Create a short-lived Supabase signed upload URL.
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
          description: Internal user id used as part of the object path.
        - in: query
          name: ext
          required: false
          schema:
            type: string
            example: png
          description: File extension appended to the avatar filename.
        - in: query
          name: contentType
          required: false
          schema:
            type: string
            example: image/png
          description: Hint for the client when uploading the file.
      responses:
        200:
          description: Signed URL issued successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bucket:
                    type: string
                  key:
                    type: string
                  url:
                    type: string
                  token:
                    type: string
                  expiresIn:
                    type: integer
                  contentType:
                    type: string
        400:
          description: Missing userId query parameter.
        500:
          description: Supabase credentials missing or the storage API failed.
  /api/storage/avatar-url:
    get:
      tags: [Storage]
      summary: Create a signed download URL for an existing avatar.
      parameters:
        - in: query
          name: key
          required: true
          schema:
            type: string
          description: Path within the Supabase bucket (e.g. `avatars/123.png`).
      responses:
        200:
          description: Signed download URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bucket:
                    type: string
                  key:
                    type: string
                  url:
                    type: string
                  expiresIn:
                    type: integer
        400:
          description: Missing key query parameter.
        500:
          description: Supabase credentials missing or storage read failed.
