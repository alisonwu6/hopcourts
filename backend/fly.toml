# fly.toml app configuration file generated for backend-dark-starlight-5928 on 2026-06-11T17:44:56+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sportsmatch-api-staging'
primary_region = 'syd'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '15s'
  method = 'GET'
  path = '/api/v1/health'
  timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
