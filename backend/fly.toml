# fly.toml app configuration file generated for sportsmatch-api on 2026-02-06T05:39:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sportsmatch-api'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"
  build-target = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
