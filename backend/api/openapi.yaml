openapi: 3.1.0
info:
  title: Sportsmatch API
  version: 1.0.0
  description: |
    Reverse-engineered OpenAPI description of the current Sportsmatch backend.
    Every path mirrors the handlers that exist today—no speculative endpoints.
servers:
  - url: http://localhost:3000
    description: Local development server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        detail:
          type: string
        code:
          type: string
        error:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        full_name:
          type: string
        username:
          type: string
          nullable: true
        role:
          type: string
          enum: [player, venue_manager]
        city:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        motivation:
          type: string
          nullable: true
        onboarding_status:
          $ref: '#/components/schemas/OnboardingStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlayerSport:
      type: object
      properties:
        sport:
          type: string
        skill_level:
          type: string
          enum: [beginner, intermediate, advanced]
        playing_style:
          type: string
          enum: [social, competitive, learning, mixed]
    PlayerArea:
      type: object
      properties:
        area_name:
          type: string
        postal_code:
          type: string
          nullable: true
    PlayerProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            sports:
              type: array
              items:
                $ref: '#/components/schemas/PlayerSport'
            areas:
              type: array
              items:
                $ref: '#/components/schemas/PlayerArea'
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
        onboardingStatus:
          $ref: '#/components/schemas/OnboardingStatus'
    OnboardingStatus:
      type: object
      properties:
        hasRole:
          type: boolean
        hasBasicInfo:
          type: boolean
        hasUsername:
          type: boolean
        hasSports:
          type: boolean
        hasSkillLevels:
          type: boolean
        hasPlayingStyle:
          type: boolean
        hasPreferredAreas:
          type: boolean
        hasPlayFrequency:
          type: boolean
        hasAvatar:
          type: boolean
        hasMotivation:
          type: boolean
        hasVenueDetails:
          type: boolean
        hasVenueSports:
          type: boolean
        hasVenueCourts:
          type: boolean
        hasVenuePhoto:
          type: boolean
        hasVenueVerification:
          type: boolean
        isComplete:
          type: boolean
    GameSummary:
      type: object
      properties:
        id:
          type: integer
        creator_id:
          type: integer
        venue_id:
          type: integer
          nullable: true
        title:
          type: string
        sport:
          type: string
        description:
          type: string
          nullable: true
        skill_level:
          type: string
          enum: [beginner, intermediate, advanced, mixed]
        energy:
          type: integer
        location_name:
          type: string
          nullable: true
        location_address:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        max_players:
          type: integer
        price:
          type: number
          format: float
        currency:
          type: string
        requires_approval:
          type: boolean
        status:
          type: string
          enum: [scheduled, completed, cancelled]
        cancel_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        host_name:
          type: string
        host_avatar:
          type: string
          nullable: true
        venue_name:
          type: string
          nullable: true
        attendee_count:
          type: integer
    GamePlayer:
      type: object
      properties:
        player_id:
          type: integer
        status:
          type: string
          enum: [joined, cancelled, waitlisted]
        created_at:
          type: string
          format: date-time
        full_name:
          type: string
        avatar_url:
          type: string
          nullable: true
    GameMessage:
      type: object
      properties:
        id:
          type: integer
        game_id:
          type: integer
        sender_id:
          type: integer
        body:
          type: string
        created_at:
          type: string
          format: date-time
        sender_name:
          type: string
        sender_avatar:
          type: string
          nullable: true
    GameDetail:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          properties:
            venue_address:
              type: string
              nullable: true
            venue_city:
              type: string
              nullable: true
            attendees:
              type: array
              items:
                $ref: '#/components/schemas/GamePlayer'
            messages:
              type: array
              items:
                $ref: '#/components/schemas/GameMessage'
    GameListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GameSummary'
    PlayersResponse:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/GamePlayer'
    MessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/GameMessage'
    Venue:
      type: object
      properties:
        id:
          type: integer
        manager_id:
          type: integer
        name:
          type: string
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        photo_url:
          type: string
          nullable: true
        verified:
          type: boolean
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sports:
          type: array
          items:
            type: string
    VenueListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
    Sport:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
    SportsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sport'
    StorageUploadResponse:
      type: object
      properties:
        bucket:
          type: string
        key:
          type: string
        url:
          type: string
          format: uri
        token:
          type: string
        expiresIn:
          type: integer
        contentType:
          type: string
    StorageDownloadResponse:
      type: object
      properties:
        bucket:
          type: string
        key:
          type: string
        url:
          type: string
          format: uri
        expiresIn:
          type: integer
    BurnResponse:
      type: object
      properties:
        ok:
          type: boolean
        ms:
          type: integer
        loops:
          type: integer
    CpuResponse:
      type: object
      properties:
        message:
          type: string
        input:
          type: integer
        result:
          type: integer
        duration:
          type: string
    VideoUploadResponse:
      type: object
      properties:
        message:
          type: string
        filename:
          type: string
    VideoTranscodeResponse:
      type: object
      properties:
        message:
          type: string
        output:
          type: string
    UsernameAvailability:
      type: object
      properties:
        available:
          type: boolean
paths:
  /api/health:
    get:
      tags: [System]
      summary: Liveness probe
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: health is good
  /healthz:
    get:
      tags: [System]
      summary: Load balancer health probe
      responses:
        '200':
          description: Always returns 200 with an empty body.
  /api/burn:
    get:
      tags: [System]
      summary: Force CPU load for debugging
      parameters:
        - in: query
          name: ms
          schema:
            type: integer
            default: 200
          description: Milliseconds to block per loop.
        - in: query
          name: loops
          schema:
            type: integer
            default: 10
          description: Number of loops to run.
      responses:
        '200':
          description: Burn completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BurnResponse'
  /api/cpu-heavy:
    get:
      tags: [System]
      summary: Run recursive Fibonacci for load-testing
      parameters:
        - in: query
          name: n
          schema:
            type: integer
            default: 40
          description: n passed to the Fibonacci function.
      responses:
        '200':
          description: Calculation complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CpuResponse'
  /debug/redis-ping:
    get:
      tags: [System]
      summary: Ping Redis (only enabled outside production)
      responses:
        '200':
          description: Redis replied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pong:
                    type: string
        '500':
          description: Redis is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/video/upload-video:
    post:
      tags: [Media]
      summary: Upload a raw video file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  format: binary
                  description: File field handled by multer.
      responses:
        '200':
          description: Video stored on disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUploadResponse'
        '400':
          description: Missing video file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/video/transcode:
    get:
      tags: [Media]
      summary: Transcode a previously uploaded video
      parameters:
        - in: query
          name: filename
          schema:
            type: string
          required: true
          description: Name of the source file in uploads/videos.
      responses:
        '200':
          description: Transcoding started and finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTranscodeResponse'
        '400':
          description: Missing filename.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ffmpeg error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/storage/avatar-upload-url:
    get:
      tags: [Storage]
      summary: Create a signed Supabase upload URL
      description: |
        Mounted under both `/api/storage` and `/api/s3`. No authentication enforced today.
      parameters:
        - in: query
          name: userId
          schema:
            type: string
          required: true
          description: Used to build the object key `avatars/{userId}.{ext}`.
        - in: query
          name: ext
          schema:
            type: string
            default: png
          description: File extension (alphanumeric only).
        - in: query
          name: contentType
          schema:
            type: string
            default: image/png
          description: MIME type hint returned in the payload.
      responses:
        '200':
          description: Signed upload URL issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageUploadResponse'
        '400':
          description: Missing required query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Supabase misconfiguration/errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/storage/avatar-url:
    get:
      tags: [Storage]
      summary: Create a signed download URL for an avatar
      parameters:
        - in: query
          name: key
          schema:
            type: string
          description: Storage object key. `path` works as an alias.
        - in: query
          name: path
          schema:
            type: string
          description: Alternate name for `key`.
      responses:
        '200':
          description: Signed download URL issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageDownloadResponse'
        '400':
          description: Missing key/path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Supabase error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a username/password account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                  enum: [player, venue_manager]
                city:
                  type: string
                gender:
                  type: string
                username:
                  type: string
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing mandatory fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate email or username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Dummy logout endpoint
      responses:
        '200':
          description: Always returns success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
  /api/users/me:
    get:
      tags: [Users]
      summary: Fetch the authenticated user's profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
        '401':
          description: Missing/invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Users]
      summary: Update profile & preferences
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                bio:
                  type: string
                city:
                  type: string
                gender:
                  type: string
                motivation:
                  type: string
                sports:
                  type: array
                  items:
                    type: object
                    properties:
                      sport:
                        type: string
                      skillLevel:
                        type: string
                      playingStyle:
                        type: string
                areas:
                  type: array
                  items:
                    type: object
                    properties:
                      areaName:
                        type: string
                      postalCode:
                        type: string
      responses:
        '200':
          description: Updated profile snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
  /api/users/check/username:
    get:
      tags: [Users]
      summary: Check if a username is available
      parameters:
        - in: query
          name: value
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailability'
        '400':
          description: Missing query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/{id}:
    get:
      tags: [Users]
      summary: Fetch any user's public profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Profile snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/discover/games:
    get:
      tags: [Games]
      summary: List public games with optional filters
      parameters:
        - in: query
          name: sport
          schema:
            type: string
        - in: query
          name: area
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Matching games.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListResponse'
  /api/games/mine:
    get:
      tags: [Games]
      summary: Games the current user has joined
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Joined games.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListResponse'
  /api/games:
    post:
      tags: [Games]
      summary: Create a game
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, sport, startTime, endTime, maxPlayers]
              properties:
                title:
                  type: string
                sport:
                  type: string
                description:
                  type: string
                skillLevel:
                  type: string
                energy:
                  type: integer
                locationName:
                  type: string
                locationAddress:
                  type: string
                area:
                  type: string
                city:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                maxPlayers:
                  type: integer
                price:
                  type: number
                currency:
                  type: string
                requiresApproval:
                  type: boolean
                venueId:
                  type: integer
      responses:
        '201':
          description: Created game (full detail payload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '400':
          description: Missing mandatory fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/games/{id}:
    get:
      tags: [Games]
      summary: Get a single game with attendees/messages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Game detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '404':
          description: Missing game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Games]
      summary: Update a game you created
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of the create-game fields plus optional `updateMessage` used to notify attendees.
      responses:
        '200':
          description: Updated details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '403':
          description: Not the host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Games]
      summary: Delete a game with no active participants
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted.
        '400':
          description: Game still has joined players.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/games/{id}/cancel:
    post:
      tags: [Games]
      summary: Cancel a game you host
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Updated game payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '400':
          description: Missing reason or already cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/games/{id}/join:
    post:
      tags: [Games]
      summary: Join a game
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated player roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersResponse'
        '400':
          description: Game full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/games/{id}/leave:
    delete:
      tags: [Games]
      summary: Leave a game you previously joined
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Confirmation payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '500':
          description: Could not update status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/games/{id}/players:
    get:
      tags: [Games]
      summary: List every player record for a game
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Player rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersResponse'
  /api/games/{id}/messages:
    get:
      tags: [Messages]
      summary: Read the game thread
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chronological list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesResponse'
    post:
      tags: [Messages]
      summary: Post a message in a game you host or joined
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        '201':
          description: Newly created message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameMessage'
        '403':
          description: User is neither the host nor a joined participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/onboarding/player/progress:
    get:
      tags: [Onboarding]
      summary: Fetch the player's onboarding checklist
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current status flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
  /api/onboarding/player/complete:
    post:
      tags: [Onboarding]
      summary: Complete onboarding in a single call
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                city:
                  type: string
                gender:
                  type: string
                username:
                  type: string
                sports:
                  type: array
                  items:
                    type: object
                areas:
                  type: array
                  items:
                    type: object
                motivation:
                  type: string
      responses:
        '200':
          description: Updated onboarding flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
  /api/onboarding/player/{step}:
    post:
      tags: [Onboarding]
      summary: Persist a single onboarding step
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: step
          required: true
          schema:
            type: string
            enum: [role, basic-info, username, sports, style, areas, frequency, avatar, motivation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Payload shape depends on the step. Examples include `{ "role": "player" }`,
                `{ "fullName": "Sam" }`, `{ "sports": [{"sport":"basketball","skill_level":"beginner"}] }`,
                `{ "areas": [{"areaName":"CBD"}] }`, or `{ "avatarUrl": "https://..." }`.
      responses:
        '200':
          description: Updated onboarding status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
        '400':
          description: Unknown step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/onboarding/venue/{step}:
    post:
      tags: [Onboarding]
      summary: Venue onboarding workflow
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: step
          required: true
          schema:
            type: string
            enum: [details, sports, courts, photo, verify]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                * `details`: name, address, contact info, optional `venueId` to update.
                * `sports`: `{ "venueId": 1, "sports": ["basketball"] }`.
                * `courts`, `photo`, `verify`: `{ "venueId": 1, ... }` as needed.
      responses:
        '200':
          description: Status plus optional venueId echo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/OnboardingStatus'
                  venueId:
                    type: integer
        '400':
          description: Missing venueId (for certain steps) or invalid step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/onboarding/venue/verify/{token}:
    get:
      tags: [Onboarding]
      summary: Dummy verification endpoint
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Always returns verified true.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                  token:
                    type: string
  /api/venues:
    get:
      tags: [Venues]
      summary: List venues
      responses:
        '200':
          description: All venues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueListResponse'
  /api/venues/{id}:
    get:
      tags: [Venues]
      summary: Fetch a single venue
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Venue payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          description: Venue not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sports:
    get:
      tags: [Reference]
      summary: List sport metadata
      responses:
        '200':
          description: Static sport catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsResponse'
  /api/admin:
    get:
      tags: [Admin]
      summary: Supabase-admin only test route
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Returns the decoded Supabase user with groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
        '401':
          description: Missing/invalid Supabase token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks Admin group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
