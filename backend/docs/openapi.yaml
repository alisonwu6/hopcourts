openapi: 3.0.3
info:
  title: SportsMatch API
  version: 1.0.0
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Master Data
  - name: Profile
  - name: Sessions
  - name: Venues
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: ok
  /sessions:
    get:
      tags: [Sessions]
      summary: List upcoming sessions
      parameters:
        - in: query
          name: sport_key
          schema: { type: string }
        - in: query
          name: city_key
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: ok
    post:
      tags: [Sessions]
      summary: Create a session
      security: [{ ApiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Session'
      responses:
        "200":
          description: ok
  /sessions/{id}:
    get:
      tags: [Sessions]
      summary: Get session by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
  /sessions/{id}/join:
    post:
      tags: [Sessions]
      summary: Join a session
      security: [{ ApiKeyHeader: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
    delete:
      tags: [Sessions]
      summary: Leave a session
      security: [{ ApiKeyHeader: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
  /sessions/{sessionId}/check-in:
    post:
      tags: [Sessions]
      summary: Check-in to a session
      security: [{ ApiKeyHeader: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
      responses:
        "200":
          description: ok
  /meta/dictionaries:
    get:
      tags: [Master Data]
      summary: Get dictionaries meta
      responses:
        "200":
          description: ok
  /sports:
    get:
      tags: [Master Data]
      summary: List sports
      parameters:
        - in: query
          name: lang
          schema: { type: string, enum: [zh, en] }
      responses:
        "200":
          description: ok
  /countries:
    get:
      tags: [Master Data]
      summary: List countries
      responses:
        "200":
          description: ok
  /cities:
    get:
      tags: [Master Data]
      summary: List cities
      responses:
        "200":
          description: ok
  /vibes:
    get:
      tags: [Master Data]
      summary: List vibes
      responses:
        "200":
          description: ok
  /age-ranges:
    get:
      tags: [Master Data]
      summary: List age ranges
      responses:
        "200":
          description: ok
  /me/profile:
    get:
      tags: [Profile]
      summary: Get my profile
      security: [{ ApiKeyHeader: [] }]
      responses:
        "200":
          description: ok
    put:
      tags: [Profile]
      summary: Update profile
      security: [{ ApiKeyHeader: [] }]
      responses:
        "200":
          description: ok
  /me/preferences:
    get:
      tags: [Profile]
      summary: Get my preferences
      security: [{ ApiKeyHeader: [] }]
      responses:
        "200":
          description: ok
  /me/onboarding:
    get:
      tags: [Profile]
      summary: Get onboarding status
      security: [{ ApiKeyHeader: [] }]
      responses:
        "200":
          description: ok
  /me/stats:
    get:
      tags: [Profile]
      summary: Get my stats
      security: [{ ApiKeyHeader: [] }]
      responses:
        "200":
          description: ok
  /me/teammates:
    get:
      tags: [Profile]
      summary: List my teammates
      security: [{ ApiKeyHeader: [] }]
      responses:
        "200":
          description: ok
  /profiles/{username}:
    get:
      tags: [Profile]
      summary: Get user profile by username
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
  /profiles/{username}/follow:
    post:
      tags: [Profile]
      summary: Follow a user
      security: [{ ApiKeyHeader: [] }]
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
    delete:
      tags: [Profile]
      summary: Unfollow a user
      security: [{ ApiKeyHeader: [] }]
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
  /venues:
    get:
      tags: [Venues]
      summary: List venues
      parameters:
        - in: query
          name: lat
          schema: { type: number }
        - in: query
          name: lng
          schema: { type: number }
        - in: query
          name: radiusKm
          schema: { type: number }
      responses:
        "200":
          description: ok
  /venues/{id}:
    get:
      tags: [Venues]
      summary: Get venue by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
  /venues/{id}/claim:
    post:
      tags: [Venues]
      summary: Request to claim a venue (Lead generation)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueClaimRequest'
      responses:
        "200":
          description: ok
  /venues/venue-claims/{id}/approve:
    post:
      tags: [Venues]
      summary: Approve a venue claim (Admin)
      security: [{ ApiKeyHeader: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
  /venues/venue-claims/{id}/reject:
    post:
      tags: [Venues]
      summary: Reject a venue claim (Admin)
      security: [{ ApiKeyHeader: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-user-id
  schemas:
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        sport_key: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        gender: { type: string, enum: [mixed, female, male] }
        skill_level: { type: string, enum: [any, beginner, intermediate, advanced] }
        is_official: { type: boolean }
        photos: { type: array, items: { type: string } }
        price: { type: number }
        price_note: { type: string }
        is_free: { type: boolean }
        min_people: { type: integer }
        max_people: { type: integer }
        host_user_id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid, nullable: true }
        place_name: { type: string }
        address: { type: string }
        lat: { type: number, format: float }
        lng: { type: number, format: float }
        location_source: { type: string }
        checkin_radius_m: { type: integer }
        checkin_open_mins_before: { type: integer }
        checkin_close_mins_after: { type: integer }
        status: { type: string, enum: [draft, published, cancelled, completed] }
        visibility: { type: string, enum: [public, private, link] }
        currency: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        gender: { type: string, enum: [male, female] }
        avatar_url: { type: string }
        teammate_count: { type: integer }
    Venue:
      type: object
      properties:
        id: { type: string, format: uuid }
        name_display: { type: string }
        status: { type: string, enum: [unclaimed, claimed] }
    VenueClaim:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected] }
    VenueClaimRequest:
      type: object
      required: [contact_name, contact_person, contact_title, contact_phone, contact_email]
      properties:
        contact_name: { type: string }
        contact_person: { type: string }
        contact_title: { type: string }
        contact_phone: { type: string }
        contact_email: { type: string }
        note: { type: string }
