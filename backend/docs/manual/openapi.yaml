openapi: 3.1.0
info:
  title: SportsMatch API
  version: 0.1.0
  description: |
    Hand-authored OpenAPI spec for SportsMatch.
    Single source of truth for public endpoints and contracts.
    This file is maintained manually (no auto-generation).

  contact:
    name: SportsMatch Dev
    email: dev@sportsmatch.app

servers:
  - url: http://localhost:3000/api
    description: Local dev
  - url: https://api.sportsmatch.app
    description: Production (placeholder)

tags:
  - name: Auth
    description: Authentication & session
  - name: Profiles
    description: Player profiles and preferences
  - name: Games
    description: Sports games discovery & management
  - name: GameMembers
    description: Join/leave games and membership states
  - name: Venues
    description: Venue directory
  - name: Health
    description: Service health & metadata

paths:
  /discover/games:
    get:
      security: []  
      summary: List games for explore feed
      description: |
        Returns a filtered list of games for the explore screen.
        Later we can add query parameters for date, sport, skillLevel, etc.
      tags:
        - Games
      responses:
        '200':
          description: List of games.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameCardDTO'
                required:
                  - data
        '500':
          description: Unexpected server error.

    post:
      summary: Create or update a game
      description: |
        Creates a new game when id is not provided.
        Updates an existing game when id is provided in the payload.
      tags:
        - Games
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveGamePayload'
      responses:
        '200':
          description: Game created or updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GameDetailDTO'
                required:
                  - data
        '400':
          description: Validation error in the request payload.
        '401':
          description: Authentication required.
        '500':
          description: Unexpected server error.

  /games/{id}:
    get:
      summary: Get game detail
      description: Returns the full GameDetailDTO for the given game id.
      tags:
        - Games
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Game id.
      responses:
        '200':
          description: Game detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GameDetailDTO'
                required:
                  - data
        '404':
          description: Game not found.
        '500':
          description: Unexpected server error.

components:
  securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
  schemas:
    SkillLevel:
      type: string
      description: Skill level required or recommended for this game.
      enum:
        - all
        - beginner
        - intermediate
        - advanced

    PriceType:
      type: string
      description: How participants pay for this session.
      enum:
        - free        # completely free
        - pay_on_site # pay at the venue (cash/card)
        - fixed       # explicit fixed amount in priceAmount

    GameStatus:
      type: string
      description: Publication status of the game.
      enum:
        - draft
        - published
        - cancelled
        - completed

    HostSummaryDTO:
      type: object
      description: Lightweight host information shown on game cards and detail views.
      properties:
        id:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
          format: uri
        tagline:
          type: string
          nullable: true
        rating:
          type: number
          format: float
          nullable: true
          description: Average rating score (e.g. 4.8).
        totalHostedSessions:
          type: integer
          format: int32
          nullable: true
          description: Total number of sessions this host has created.
      required:
        - id
        - displayName

    AttendeeSummaryDTO:
      type: object
      description: Minimal attendee info shown in the participant list.
      properties:
        id:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
          format: uri
        isHost:
          type: boolean
          description: True if this attendee is the host of the game.
      required:
        - id
        - displayName
        - isHost

    GameCardDTO:
      type: object
      description: Game item used on the explore/listing screens.
      properties:
        id:
          type: string
        title:
          type: string
        sport:
          type: string
        skillLevel:
          $ref: '#/components/schemas/SkillLevel'
        coverPhotoUrl:
          type: string
          nullable: true
          format: uri
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        locationName:
          type: string
          description: Short location label shown on cards (e.g. venue name or landmark).
        area:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code (e.g. AU, TW).
        priceType:
          $ref: '#/components/schemas/PriceType'
        priceAmount:
          type: number
          format: float
          nullable: true
        currency:
          type: string
          nullable: true
          description: ISO 4217 currency code (e.g. AUD, TWD).
        capacity:
          type: integer
          format: int32
        joinedCount:
          type: integer
          format: int32
        waitlistCount:
          type: integer
          format: int32
        host:
          $ref: '#/components/schemas/HostSummaryDTO'
        spotsRemaining:
          type: integer
          format: int32
        isFull:
          type: boolean
        isFree:
          type: boolean
      required:
        - id
        - title
        - sport
        - skillLevel
        - startDateTime
        - endDateTime
        - locationName
        - priceType
        - capacity
        - joinedCount
        - waitlistCount
        - host
        - spotsRemaining
        - isFull
        - isFree

    GameDetailDTO:
      type: object
      description: Full game detail used on the game detail page.
      properties:
        id:
          type: string
        title:
          type: string
        sport:
          type: string
        skillLevel:
          $ref: '#/components/schemas/SkillLevel'
        status:
          $ref: '#/components/schemas/GameStatus'
        coverPhotoUrl:
          type: string
          nullable: true
          format: uri
        host:
          $ref: '#/components/schemas/HostSummaryDTO'
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        locationName:
          type: string
        addressLine:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        priceType:
          $ref: '#/components/schemas/PriceType'
        priceAmount:
          type: number
          format: float
          nullable: true
        currency:
          type: string
          nullable: true
        capacity:
          type: integer
          format: int32
        joinedCount:
          type: integer
          format: int32
        waitlistCount:
          type: integer
          format: int32
        spotsRemaining:
          type: integer
          format: int32
        isFull:
          type: boolean
        description:
          type: string
        notesForAttendees:
          type: string
          nullable: true
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/AttendeeSummaryDTO'
        isUserHost:
          type: boolean
        isUserJoined:
          type: boolean
        isUserWaitlisted:
          type: boolean
      required:
        - id
        - title
        - sport
        - skillLevel
        - status
        - host
        - startDateTime
        - endDateTime
        - locationName
        - priceType
        - capacity
        - joinedCount
        - waitlistCount
        - spotsRemaining
        - isFull
        - description
        - attendees
        - isUserHost
        - isUserJoined
        - isUserWaitlisted

    SaveGamePayload:
      type: object
      description: Payload used when creating or updating a game.
      properties:
        id:
          type: string
          description: Only required when updating an existing game.
        title:
          type: string
        sport:
          type: string
        skillLevel:
          $ref: '#/components/schemas/SkillLevel'
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        locationName:
          type: string
        addressLine:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        capacity:
          type: integer
          format: int32
        priceType:
          $ref: '#/components/schemas/PriceType'
        priceAmount:
          type: number
          format: float
          nullable: true
        currency:
          type: string
          nullable: true
        description:
          type: string
        notesForAttendees:
          type: string
          nullable: true
        coverPhotoUrl:
          type: string
          nullable: true
          format: uri
        status:
          $ref: '#/components/schemas/GameStatus'
      required:
        - title
        - sport
        - skillLevel
        - startDateTime
        - endDateTime
        - locationName
        - capacity
        - priceType
        - description
        - status

security:
  - bearerAuth: []    # 預設所有路由需要 Bearer（公開路由可在各 path 覆蓋）

externalDocs:
  description: API style guide & usage notes
  url: https://your-docs-hub.example.com