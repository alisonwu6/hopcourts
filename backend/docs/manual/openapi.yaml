openapi: 3.0.3
info:
  title: SportsMatch API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: ok
  /sports:
    get:
      summary: List sports
      parameters:
        - in: query
          name: lang
          schema: { type: string, enum: [zh, en] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            category:
                              type: string
                            icon:
                              type: string
                            order:
                              type: integer
                            is_active:
                              type: boolean
  /sessions:
    get:
      summary: List upcoming sessions
      parameters:
        - in: query
          name: sport
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
  /sessions/{id}:
    get:
      summary: Get session by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/Session'
components:
  schemas:
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        host_user_id: { type: string, format: uuid }
        sport_key: { type: string }
        title: { type: string }
        notes: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        place_name: { type: string }
        address: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        checkin_radius_m: { type: integer }
        checkin_open_mins_before: { type: integer }
        checkin_close_mins_after: { type: integer }
        min_people: { type: integer }
        max_people: { type: integer, nullable: true }
        status:
          type: string
          enum: [draft, published, cancelled, completed]
        visibility:
          type: string
          enum: [public, unlisted]
