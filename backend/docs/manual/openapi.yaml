openapi: 3.0.3
info:
  title: SportsMatch API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: ok
  /sports:
    get:
      summary: List sports
      parameters:
        - in: query
          name: lang
          schema: { type: string, enum: [zh, en] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            category:
                              type: string
                            icon:
                              type: string
                            order:
                              type: integer
                            is_active:
                              type: boolean
