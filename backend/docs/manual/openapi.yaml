openapi: 3.0.3
info:
  title: SportsMatch API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: ok
  /sports:
    get:
      summary: List sports
      parameters:
        - in: query
          name: lang
          schema: { type: string, enum: [zh, en] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            category:
                              type: string
                            icon:
                              type: string
                            order:
                              type: integer
                            is_active:
                              type: boolean
  /sessions:
    get:
      summary: List upcoming sessions
      parameters:
        - in: query
          name: sport_key
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
                      page:
                        $ref: '#/components/schemas/Page'
  /sessions/{id}:
    get:
      summary: Get session by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/Session'
                      meta:
                        $ref: '#/components/schemas/SessionMeta'
  /sessions/{id}/join:
    post:
      summary: Join a session
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      session_id: { type: string, format: uuid }
                      joined: { type: boolean }
                      meta: { $ref: '#/components/schemas/SessionMeta' }
    delete:
      summary: Leave a session
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      session_id: { type: string, format: uuid }
                      joined: { type: boolean }
                      meta: { $ref: '#/components/schemas/SessionMeta' }
  /sessions/{sessionId}/check-in:
    post:
      summary: Check-in to a session (GPS + time window)
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      check_in:
                        $ref: '#/components/schemas/CheckIn'
        "401": { description: Unauthenticated }
        "403": { description: Outside time/radius or not allowed }
        "404": { description: Session not found }
components:
  schemas:
    Page:
      type: object
      properties:
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        host_user_id: { type: string, format: uuid }
        sport_key: { type: string }
        title: { type: string }
        notes: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        place_name: { type: string }
        address: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        checkin_radius_m: { type: integer }
        checkin_open_mins_before: { type: integer }
        checkin_close_mins_after: { type: integer }
        min_people: { type: integer }
        max_people: { type: integer, nullable: true }
        status:
          type: string
          enum: [draft, published, cancelled, completed]
        visibility:
          type: string
          enum: [public, unlisted]
    SessionMeta:
      type: object
      properties:
        participant_count: { type: integer }
        spots_left:
          type: integer
          nullable: true
        is_joined:
          type: boolean
        viewer_has_joined:
          type: boolean
        viewer_has_checked_in:
          type: boolean
    CheckIn:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        checked_in_at: { type: string, format: date-time }
        lat: { type: number }
        lng: { type: number }
        distance_m: { type: integer }
        status: { type: string }
